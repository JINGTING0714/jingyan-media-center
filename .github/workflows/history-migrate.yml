name: History Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "History task mode"
        required: true
        default: "migrate"
        type: choice
        options:
          - report
          - migrate

concurrency:
  group: jingyan-media-pipeline
  cancel-in-progress: false

jobs:

  migrate:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Media Center
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Dependencies
        run: npm install --omit=dev --package-lock=false


      - name: Run History Task
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: node api/history.js "${{ inputs.mode }}"


      - name: Save History State
        if: always()

        shell: bash

        run: |

          set -e

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add config.json data/cdn-manifest.json data/history-report.json


          if git diff --cached --quiet; then

            echo "No history state changes."

            exit 0

          fi


          git commit -m "chore: update history migration state"


          for attempt in 1 2 3; do

            echo "Push attempt: $attempt"

            git fetch origin main


            if ! git rebase origin/main; then

              echo "Rebase conflict. Aborting safely."

              git rebase --abort || true

              exit 1

            fi


            if git push origin HEAD:main; then

              echo "History state pushed."

              exit 0

            fi


            sleep $((attempt * 2))

          done


          echo "Failed to push history state after 3 attempts."

          exit 1
