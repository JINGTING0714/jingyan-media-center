name: Media Permanent Delete

on:
  workflow_dispatch:
    inputs:

      media_id:
        description: "Media ID"
        required: true
        type: string

      media_type:
        description: "Media type"
        required: true
        type: string

      source_repository:
        description: "Source repository"
        required: true
        type: string

      source_branch:
        description: "Source branch"
        required: true
        type: string

      source_path:
        description: "Source path"
        required: true
        type: string

      public_path:
        description: "CDN public path"
        required: true
        type: string


concurrency:
  group: jingyan-media-pipeline
  cancel-in-progress: false


jobs:

  purge:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    env:
      STORAGE_GITHUB_OWNER: jingyan-media-storage

      DELETE_MEDIA_ID: ${{ inputs.media_id }}
      DELETE_MEDIA_TYPE: ${{ inputs.media_type }}
      DELETE_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      DELETE_SOURCE_BRANCH: ${{ inputs.source_branch }}
      DELETE_SOURCE_PATH: ${{ inputs.source_path }}
      DELETE_PUBLIC_PATH: ${{ inputs.public_path }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Dependencies
        run: |
          npm install --omit=dev --package-lock=false


      - name: Validate Delete Runner
        run: |
          node --check api/media-delete-runner.js
          node --check api/github.js
          node --check api/database.js
          node --check api/cloudflare.js


      - name: Permanently Delete Media
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          node api/media-delete-runner.js


      - name: Save CDN Manifest
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cdn-manifest.json

          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "chore: purge ${DELETE_MEDIA_ID}"

            for attempt in 1 2 3; do

              git fetch origin main

              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Manifest pushed."
                break
              fi

              sleep $((attempt * 2))

            done
          fi


      - name: Refresh Media Index
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh workflow run media-index-sync.yml --ref main
