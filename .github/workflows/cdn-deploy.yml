name: Unified CDN Deploy

on:
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Media Center
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Verify Node
        run: |
          node --version
          npm --version


      - name: Prepare CDN Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |

          set -e

          echo "Preparing unified CDN test asset..."

          mkdir -p cdn-assets/audio


          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/JINGTING0714/jingyan-media-01/contents/music/003-fang-da-tong-boarding.mp3?ref=main" \
            --output "cdn-assets/audio/003-fang-da-tong-boarding.mp3"


          if [ ! -s "cdn-assets/audio/003-fang-da-tong-boarding.mp3" ]; then

            echo "Downloaded asset is empty."

            exit 1

          fi


          echo "Asset ready:"

          ls -lh cdn-assets/audio/


      - name: Deploy Unified CDN
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          set -e

          echo "Deploying unified CDN..."

          npx --yes wrangler@latest deploy --config wrangler.jsonc


      - name: Show CDN URL
        run: |

          echo "Unified CDN deployment complete."

          echo "Test URL:"

          echo "https://jingyan-media-cdn.jingyancdn.workers.dev/audio/003-fang-da-tong-boarding.mp3"
