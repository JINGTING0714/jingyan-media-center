name: Unified CDN Deploy

on:
  workflow_dispatch:

concurrency:
  group: jingyan-media-pipeline
  cancel-in-progress: false

jobs:

  deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Media Center
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Dependencies
        run: |

          npm install --omit=dev --package-lock=false


      - name: Publish Unified CDN
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          node api/cloudflare.js publish


      - name: Save CDN Manifest
        if: always()

        shell: bash

        run: |

          set -e


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/cdn-manifest.json


          if git diff --cached --quiet; then

            echo "No manifest changes."

            exit 0

          fi


          git commit -m "chore: update CDN manifest"


          for attempt in 1 2 3; do

            git fetch origin main


            if ! git rebase origin/main; then

              git rebase --abort || true

              exit 1

            fi


            if git push origin HEAD:main; then

              echo "CDN manifest pushed."

              exit 0

            fi


            sleep $((attempt * 2))

          done


          echo "Failed to push CDN manifest."

          exit 1
