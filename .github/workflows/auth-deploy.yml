name: Auth Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-deploy.yml"
      - "auth-worker/**"
      - "api/media-index-sync.js"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: jingyan-auth-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --omit=dev --package-lock=false

      - name: Prepare Passkey Browser Asset
        shell: bash
        run: |
          set -e

          mkdir -p auth-worker/public/vendor

          cp \
            node_modules/@simplewebauthn/browser/dist/bundle/index.umd.min.js \
            auth-worker/public/vendor/simplewebauthn-browser.js

          test -s auth-worker/public/vendor/simplewebauthn-browser.js

      - name: Validate Auth Configuration
        shell: bash
        run: |
          set -e

          if grep -q "REPLACE_WITH_D1_DATABASE_ID" auth-worker/wrangler.jsonc; then
            echo "D1 database_id has not been configured."
            exit 1
          fi

          for file in auth-worker/src/*.mjs; do
            node --check "$file"
          done

          for file in auth-worker/public/*.js; do
            node --check "$file"
          done

          node --check api/media-index-sync.js

          node -e "const p=require('./package.json'); if(p.version!=='11.0.0') throw new Error('Unexpected application version');"

          node -e "const p=require('./package.json'); if(p.dependencies['@simplewebauthn/server']!=='13.3.2') throw new Error('SimpleWebAuthn server version mismatch');"

          node -e "const p=require('./package.json'); if(p.dependencies['@simplewebauthn/browser']!=='13.3.0') throw new Error('SimpleWebAuthn browser version mismatch');"

      - name: Apply Auth D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.116.0 d1 migrations apply jingyan-media-auth \
            --remote \
            --config auth-worker/wrangler.jsonc

      - name: Apply Media D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.116.0 d1 migrations apply jingyan-media-index \
            --remote \
            --config auth-worker/wrangler.jsonc

      - name: Deploy Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.116.0 deploy \
            --config auth-worker/wrangler.jsonc

      - name: Repair And Refresh Media Ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run media-index-sync.yml --ref main
