name: Media Upload


on:

  push:

    paths:

      - "upload/**"



jobs:


  upload:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20



      - name: Install dependencies

        run: |

          npm install



      - name: Check upload files

        run: |

          echo "Checking upload folder..."

          ls -la upload



      - name: Run upload system

        env:

          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}

        run: |

          node api/upload.js
