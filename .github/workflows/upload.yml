name: Media Upload


on:

  workflow_dispatch:

    inputs:

      type:

        description: "media type"

        required: true


      filename:

        description: "filename"

        required: true



permissions:

  contents: write



jobs:


  upload:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: System Check

      run: |

        echo "Jingyan Media Center"

        echo "Type: ${{ github.event.inputs.type }}"

        echo "File: ${{ github.event.inputs.filename }}"



    - name: Prepare

      run: |

        mkdir -p upload



    - name: Finish

      run: |

        echo "Upload pipeline ready"
