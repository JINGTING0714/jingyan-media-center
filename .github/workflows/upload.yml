name: Media Upload


on:

  push:

    paths:

      - "upload/**"


jobs:


  upload:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Install

        run: |

          npm install



      - name: Process Upload

        run: |

          node api/upload.js



      - name: Commit Update

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add .

          git commit -m "auto update media"

          git push
