name: Media Upload Automation


on:

  push:

    paths:

      - "upload/**"

      - "api/**"

      - "config.json"

      - "auth.template.json"





jobs:


  upload:


    runs-on: ubuntu-latest



    permissions:


      contents: write






    steps:



      - name: Checkout

        uses: actions/checkout@v4






      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20






      - name: Check Upload Files


        id: check


        run: |


          echo "Checking upload folder..."



          if [ ! -d upload ]; then

            echo "skip=true" >> $GITHUB_OUTPUT

            exit 0

          fi





          count=$(find upload -type f ! -name ".gitkeep" | wc -l)



          echo "files=$count"



          if [ "$count" -eq 0 ]; then


            echo "No files"



            echo "skip=true" >> $GITHUB_OUTPUT


          else


            echo "Files detected"



            echo "skip=false" >> $GITHUB_OUTPUT


          fi







      - name: Run Media Upload


        if: steps.check.outputs.skip == 'false'


        env:


          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}



        run: |


          node api/upload.js







      - name: Commit Database Update



        if: steps.check.outputs.skip == 'false'



        run: |


          git config user.name "github-actions"


          git config user.email "github-actions@github.com"



          git add .


          git commit -m "Update media database" || echo "No changes"



          git push
