name: Media Upload Automation


on:

  push:

    paths:

      - "upload/**"

      - "api/**"

      - "config.json"

      - "auth.template.json"





jobs:


  upload:


    runs-on: ubuntu-latest



    permissions:

      contents: write





    steps:


      - name: Checkout

        uses: actions/checkout@v4





      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20





      - name: Check upload files


        id: check


        run: |


          echo "Checking upload folder"



          if [ ! -d "upload" ]; then

            echo "skip=true" >> $GITHUB_OUTPUT

            exit 0

          fi



          files=$(find upload -type f | wc -l)



          echo "files=$files"



          if [ "$files" -eq 0 ]; then


            echo "skip=true" >> $GITHUB_OUTPUT


          else


            echo "skip=false" >> $GITHUB_OUTPUT


          fi







      - name: Run media automation


        if: steps.check.outputs.skip == 'false'


        env:


          GH_TOKEN:

            ${{ secrets.MEDIA_TOKEN }}



        run:


          node api/upload.js







      - name: Commit database update


        if: steps.check.outputs.skip == 'false'


        run: |



          git config user.name "github-actions"


          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add data/



          git add upload/



          git diff --cached --quiet || git commit -m "Auto update media database"







      - name: Push changes


        if: steps.check.outputs.skip == 'false'


        run:



          git push
