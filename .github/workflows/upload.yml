name: Media Upload Automation

on:
  push:
    paths:
      - "upload/**"

  workflow_dispatch:
    inputs:
      web_job_id:
        description: "Upload job ID created by jingyan-media-app"
        required: false
        type: string

concurrency:
  group: jingyan-media-pipeline
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      WEB_JOB_ID: ${{ inputs.web_job_id }}
      APP_URL: https://jingyan-media-app.jingyancdn.workers.dev
      STORAGE_GITHUB_OWNER: jingyan-media-storage

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Storage V2
        run: |
          node --check api/storage-registry.js
          node --check api/github.js
          node --check api/repository.js
          node --check api/upload.js
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/storage-registry.json','utf8'))"

      - name: Check Storage Credentials
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |
          node - <<'NODE'
          const {
            githubRequest,
            getRepositoryInfo,
            getTokenForOwner
          } = require("./api/github");

          (async () => {
            const legacy = await getRepositoryInfo(
              "JINGTING0714/jingyan-image-01"
            );

            if (
              !legacy ||
              legacy.full_name !== "JINGTING0714/jingyan-image-01"
            ) {
              throw new Error(
                "MEDIA_TOKEN legacy repository check failed"
              );
            }

            const storageToken = getTokenForOwner(
              "jingyan-media-storage"
            );

            const org = await githubRequest(
              "GET",
              "/orgs/jingyan-media-storage",
              storageToken
            );

            if (
              !org ||
              org.login !== "jingyan-media-storage"
            ) {
              throw new Error(
                "STORAGE_TOKEN organization check failed"
              );
            }

            console.log(
              "Storage V2 credentials OK"
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check Upload Files
        id: check
        shell: bash
        run: |
          set -e

          if [ -n "${WEB_JOB_ID}" ]; then
            echo "Web upload job detected: ${WEB_JOB_ID}"
            echo "mode=web" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking upload folder..."

          if [ ! -d "upload" ]; then
            echo "mode=standard" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(find upload -maxdepth 1 -type f ! -name ".gitkeep" | wc -l)

          echo "Detected files: $count"
          echo "mode=standard" >> "$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          npm install --omit=dev --package-lock=false

      - name: Run Web Media Upload
        id: web_upload
        if: steps.check.outputs.mode == 'web'
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node api/web-upload-runner.js run "$WEB_JOB_ID"

      - name: Run Standard Media Upload
        id: standard_upload
        if: steps.check.outputs.mode == 'standard' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node api/upload.js

      - name: Save Automation State
        id: save_state
        if: always() && steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            config.json \
            data/storage-registry.json \
            data/cdn-manifest.json \
            upload/

          if git diff --cached --quiet; then
            echo "No local state changes."
            exit 0
          fi

          git commit -m "chore: update media pipeline state"

          for attempt in 1 2 3; do
            echo "Push attempt: $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict. Aborting state push safely."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Automation state pushed."
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Failed to push automation state after 3 attempts."
          exit 1

      - name: Report Web Upload Result
        id: report_web
        if: always() && steps.check.outputs.mode == 'web'
        env:
          PIPELINE_OK: ${{ steps.web_upload.outcome == 'success' && steps.save_state.outcome == 'success' }}
        run: |
          node api/web-upload-runner.js callback "$WEB_JOB_ID"

      - name: Index Web Upload
        if: >
          always() &&
          steps.check.outputs.mode == 'web' &&
          steps.web_upload.outcome == 'success' &&
          steps.save_state.outcome == 'success' &&
          steps.report_web.outcome == 'success'
        continue-on-error: true
        run: |
          node api/media-index-sync.js upload "$WEB_JOB_ID"

      - name: Sync Media Index
        if: >
          always() &&
          (
            steps.check.outputs.skip == 'true' ||
            (
              steps.check.outputs.mode == 'standard' &&
              steps.save_state.outcome == 'success'
            )
          )
        run: |
          node api/media-index-sync.js full
