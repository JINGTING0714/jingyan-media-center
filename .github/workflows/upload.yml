name: Media Upload


on:
  workflow_dispatch:
    inputs:

      type:
        description: media type
        required: true

      filename:
        description: filename
        required: true


jobs:

  upload:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Show upload info
      run: |

        echo "type=${{ github.event.inputs.type }}"
        echo "file=${{ github.event.inputs.filename }}"


    - name: Finish
      run: |

        echo "upload workflow ready"
